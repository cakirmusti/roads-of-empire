:root{
  --bg:#2a2118; --parsomen:#f4ecd8; --parsomen2:#ebdfc2; --cizgi:#5a4a38; --zemin:#ffffff; --orta:#ffffff; --murekkep:#2a2118;
  --altin:#c99a2e; --altin-k:#7a5a12; --mor:#4a1a6b;
  --b:min(calc((100vh - 40px) / 1.08), calc(100vw - 2 * clamp(150px, 17vw, 250px) - 30px), 1000px);
}
*{box-sizing:border-box}
html,body{margin:0;background:#3b2414;color:var(--murekkep);font-family:"RoE Serif","DejaVu Serif",Georgia,serif;min-height:100vh}
button{font-family:inherit;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;color:var(--parsomen);height:52px}
header h1{font-weight:700;font-size:20px;letter-spacing:3px;margin:0;color:#e8c766}
header .bosluk{flex:1}
.ust-btn{background:transparent;border:1px solid #8a7350;color:var(--parsomen);padding:5px 12px;border-radius:6px;font-size:15px}
.ust-btn:hover{background:#ffffff14}
main{display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:0 14px 14px}
/* ahşap masa */
body{background:
  radial-gradient(ellipse at 40% 45%,#0000 30%,#0008 100%),
  repeating-linear-gradient(92deg,#ffffff06 0 2px,#0000 2px 9px),
  repeating-linear-gradient(88deg,#00000012 0 1px,#0000 1px 23px),
  linear-gradient(180deg,#6b4226,#4a2c17 60%,#3a2211);background-attachment:fixed}
.masa{flex:1;display:flex;justify-content:center;align-items:center;perspective:1700px;perspective-origin:50% 0%;min-height:calc(100vh - 70px);padding-top:10px}
.tahta-govde{transform:rotateX(22deg);transform-origin:50% 60%;transform-style:preserve-3d;margin-top:calc(var(--b)*-0.06)}
.tahta-govde::before{content:"";position:absolute;inset:calc(var(--b)*-0.022);background:linear-gradient(135deg,#2c1a0e,#5a3a20 40%,#2c1a0e);border-radius:6px;
  box-shadow:0 calc(var(--b)*0.05) calc(var(--b)*0.07) #000c,0 calc(var(--b)*0.012) 0 #1a0f07;transform:translateZ(-2px)}

/* ---------- TAHTA ---------- */
.tahta{width:var(--b);height:var(--b);display:grid;
  grid-template-columns:1.35fr repeat(7,1fr) 1.35fr;grid-template-rows:1.35fr repeat(7,1fr) 1.35fr;
  background:var(--zemin);border:2px solid var(--cizgi);flex-shrink:0;position:relative}
.kare{border:1px solid var(--cizgi);position:relative;display:flex;overflow:hidden;background:var(--zemin);cursor:pointer;min-width:0;min-height:0}
.kare:hover{filter:brightness(1.05)}
.kare.secilebilir{outline:3px solid #e8b400;outline-offset:-3px;animation:parla 1s infinite alternate}
@keyframes parla{from{filter:brightness(1)}to{filter:brightness(1.15)}}
.kare .bant{flex:0 0 22%;border-bottom:1px solid var(--cizgi)}
.kare{--u:calc(var(--b) / 9.7)}
.kare .ic{position:absolute;inset:0;display:flex;flex-direction:column}
.kare.ust .ic{flex-direction:column-reverse}
.kare.ust .bant{border-bottom:0;border-top:1px solid var(--cizgi)}
.kare.sol .ic,.kare.sag .ic{inset:auto;left:50%;top:50%;width:var(--u);height:calc(var(--u)*1.35)}
.kare.sol .ic{transform:translate(-50%,-50%) rotate(90deg)}
.kare.sag .ic{transform:translate(-50%,-50%) rotate(-90deg)}
.kare .ic .govde{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--b)*0.004);padding:1px;text-align:center}
.kare .ic .ad{font-size:calc(var(--b)*0.0138)}
.kare .ic .sehir-govde{justify-content:space-between;padding:calc(var(--b)*0.004) 1px calc(var(--b)*0.005)}
.kare .ic .fiyat{font-size:calc(var(--b)*0.0122);color:#5a4a38}
.kare .ic .ad{word-break:normal;overflow-wrap:normal;hyphens:manual}
.kare .ic .ad.cok-uzun{font-size:calc(var(--b)*0.0094);letter-spacing:-.03em}
.kare .ic .ad.uzun{font-size:calc(var(--b)*0.0114);letter-spacing:-.02em}
.kare .ic svg{width:calc(var(--u)*0.7);height:calc(var(--u)*0.7)}
.kare .ic .sans-yazi{color:#3e1659;font-weight:700;font-size:calc(var(--b)*0.0132)}
.kare.kose svg{width:calc(var(--u)*0.85);height:calc(var(--u)*0.85)}
.orta .amblem{width:calc(var(--b)*0.6);height:auto;flex-shrink:0}
.orta .zar-alan{display:flex;flex-direction:column;align-items:center;gap:2px}
.orta .merkez-btn{min-height:calc(var(--b)*0.055);align-items:center}
.orta .merkez-btn .btn{font-size:calc(var(--b)*0.021);padding:calc(var(--b)*0.008) calc(var(--b)*0.022)}

.kare .icerik{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:2px 1px;text-align:center;min-width:0}
.kare.alt{flex-direction:column}
.kare.ust{flex-direction:column-reverse}
.kare.sol{flex-direction:row-reverse}
.kare.sag{flex-direction:row}
.kare.sol .icerik,.kare.sag .icerik{justify-content:center;gap:2px}
.kare .ad{font-weight:700;font-size:calc(var(--b)*0.0125);line-height:1.05;word-break:break-word;hyphens:auto}
.kare .fiyat{font-size:calc(var(--b)*0.0115);color:#5a4a36}
.kare .simge{font-size:calc(var(--b)*0.024);line-height:1}
.kare .yapilar{position:absolute;display:flex;align-items:center;justify-content:center;gap:calc(var(--b)*0.0015);height:0;pointer-events:none;z-index:2;filter:drop-shadow(0 1px 1px #0006)}
.kare .yapilar .yk{flex:0 0 auto;height:calc(var(--b)*0.034);width:auto}
.kare .yapilar .yk.kule{width:calc(var(--b)*0.02125)}
.kare .yapilar .yk.kale{width:calc(var(--b)*0.049)}
.kare.alt .yapilar{top:11%;left:0;right:0}
.kare.ust .yapilar{bottom:11%;left:0;right:0}
.kare.sol .yapilar,.kare.sag .yapilar{top:50%;width:calc(var(--b)*0.1)}
.kare.sol .yapilar{right:11%;transform:translate(50%,0) rotate(90deg)}
.kare.sag .yapilar{left:11%;transform:translate(-50%,0) rotate(-90deg)}
.kare .sahip{position:absolute;inset:0;box-shadow:inset 0 0 0 calc(var(--b)*0.004) var(--sahip-renk),inset 0 0 calc(var(--b)*0.012) var(--sahip-renk);pointer-events:none}
.kare .piyonlar{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1px;pointer-events:none}
.kare.kose{flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--zemin);gap:calc(var(--b)*0.006)}
.kare.kose .ad{font-size:calc(var(--b)*0.0122);font-weight:700}
.kare.kose .simge{font-size:calc(var(--b)*0.04)}
.kare.kose .alt-yazi{font-size:calc(var(--b)*0.011);color:#5a4a36}

.piyon{width:calc(var(--b)*0.04);height:calc(var(--b)*0.04);position:relative;flex-shrink:0;transition:transform .12s}
.piyon::before{content:"";position:absolute;left:12%;right:12%;bottom:-8%;height:20%;border-radius:50%;background:var(--pr);box-shadow:0 0 0 1.5px #fff,0 2px 3px #0007}
.piyon img{position:relative;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;filter:drop-shadow(0 2px 1.5px #000a)}
.piyon.aktif{animation:none}
@keyframes zipla{0%,100%{transform:translateY(0) scale(1.15)}50%{transform:translateY(-18%) scale(1.15)}}

/* ---------- ORTA ---------- */
.orta{grid-area:2/2/9/9;position:relative;justify-content:center;display:flex;flex-direction:column;align-items:center;padding:calc(var(--b)*0.012);gap:calc(var(--b)*0.01);min-height:0;cursor:default;
  background:var(--orta)}
.baslik-satir{display:flex;align-items:center;gap:calc(var(--b)*0.015)}
.baslik-satir svg{width:calc(var(--b)*0.1);height:calc(var(--b)*0.1)}
.oyun-adi{font-weight:700;font-size:calc(var(--b)*0.03);letter-spacing:.12em;color:var(--mor);line-height:1}
.oyun-alt{font-size:calc(var(--b)*0.014);color:#6b5a40;letter-spacing:.2em;text-align:center}
.sira-yazi{font-size:calc(var(--b)*0.02);font-weight:700;display:flex;align-items:center;gap:8px}
.zarlar{display:flex;gap:calc(var(--b)*0.015)}
.zar{width:calc(var(--b)*0.06);height:calc(var(--b)*0.06);background:linear-gradient(145deg,#fffaf0,#e9dcc0);border:1px solid #a89470;border-radius:18%;
  box-shadow:inset -2px -3px 4px #0002,0 2px 4px #0004;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.zar i{border-radius:50%;background:transparent;margin:12%}
.zar i.n{background:#3a2a1a;box-shadow:inset 0 1px 1px #000}
.zar.donuyor{animation:don .14s linear infinite}
@keyframes don{0%{transform:rotate(0)}50%{transform:rotate(10deg) translateY(-3px)}100%{transform:rotate(0)}}
.eylemler{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:linear-gradient(#5b2a80,var(--mor));color:#fff3d6;border:1px solid #2e0f45;border-radius:8px;padding:calc(var(--b)*0.008) calc(var(--b)*0.018);font-size:calc(var(--b)*0.019);font-weight:600;box-shadow:0 2px 0 #2e0f45}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.altin{background:linear-gradient(#e0b54a,var(--altin));color:#2a1a05;border-color:var(--altin-k);box-shadow:0 2px 0 var(--altin-k)}
.btn.gri{background:linear-gradient(#8b7b62,#6f604a);border-color:#4a3f30;box-shadow:0 2px 0 #4a3f30}
.kutu{background:#fffaf0;border:2px solid var(--altin-k);border-radius:10px;padding:calc(var(--b)*0.01) calc(var(--b)*0.016);max-width:92%;text-align:center;box-shadow:0 3px 10px #0002;font-size:calc(var(--b)*0.017)}
.kutu h3{margin:0 0 4px;font-size:calc(var(--b)*0.02)}
.kart{border:3px double var(--altin-k);background:linear-gradient(#fff8e6,#f3e4bf)}
.kart .kart-ust{letter-spacing:.2em;color:var(--altin-k);font-weight:700}
.kart p{font-size:calc(var(--b)*0.02);font-style:italic;margin:6px 0 10px}
.tapu{min-width:55%}
.tapu .tapu-bas{color:#fff;margin:calc(var(--b)*-0.01) calc(var(--b)*-0.016) 6px;padding:4px;border-radius:7px 7px 0 0;font-weight:700}
.tapu table{width:100%;border-collapse:collapse;font-size:calc(var(--b)*0.015)}
.tapu td{padding:1px 4px}
.tapu td:last-child{text-align:right;font-weight:600}
.tapu tr.simdi td{background:#f2e1a8}
.gunluk{flex:1;min-height:0;width:92%;overflow:auto;background:#fffaf0aa;border:1px solid #c9b38a;border-radius:8px;padding:4px 10px;font-size:calc(var(--b)*0.015);line-height:1.35}
.gunluk div{border-bottom:1px dotted #d8c7a3;padding:1px 0}
.gunluk div:first-child{font-weight:700}

/* ---------- YAN PANEL ---------- */
.yan{width:380px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 66px);overflow:auto;padding-right:2px}

.not{font-size:13px;color:#6b5a40}

/* ---------- PENCERELER ---------- */
.perde{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.pencere{background:var(--parsomen);border:3px solid var(--altin-k);border-radius:14px;max-width:780px;width:100%;max-height:94vh;overflow:auto;padding:18px 22px;box-shadow:0 20px 60px #000}

.k-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.k-kart{border:2px solid #8a7350;border-top:6px solid var(--pr);border-radius:10px;background:#fbf6ea;padding:10px}

.k-adi{font-size:13px;font-weight:700;margin:6px 0 4px;color:#5a4a38}
.k-secim{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.k-p{aspect-ratio:1;padding:3px;border:2px solid transparent;border-radius:8px;background:#efe4c9;cursor:pointer}
.k-p img{width:100%;height:100%;object-fit:contain;display:block}
.k-p:hover:not(:disabled){border-color:#c9a23a}
.k-p.secili{border-color:var(--pr);background:#fff;box-shadow:0 0 0 2px var(--pr)}

.kurulum-satir{display:grid;grid-template-columns:34px auto 1fr 1fr auto;gap:8px;align-items:center;margin:6px 0}
.kurulum-satir input,.kurulum-satir select,.pencere select{font-family:inherit;font-size:16px;padding:5px 8px;border:1px solid #8a7350;border-radius:6px;background:#fffaf0;min-width:0}

.pencere table{border-collapse:collapse;width:100%;font-size:14.5px}
.pencere th,.pencere td{border:1px solid #c9b38a;padding:3px 6px;text-align:left}
.pencere th{background:#ebdfc2}
.renk-kutu{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:middle;margin-right:4px}
.sonuc li{font-size:18px;margin:4px 0}

}

/* ---------- çizime göre düzen: tahta ortada, dört oyuncu ekranın dört köşesinde ---------- */

  display:grid;grid-template-columns:auto 1fr;font-size:15px;overflow:hidden}

/* =====================================================================
   AYARLAR — bütün sayılar burada. Fiyatlar ve kiralar şimdilik GEÇİCİ.
   ===================================================================== */
const AYAR = {
  para: "Rotum",
  baslangicParasi: 2500,
  baslangicBonusu: 200,      // Başlangıç karesinden geçince
  vergi: 200,
  surgunCikisUcreti: 200,

  limanFiyati: 200,
  catiCarpani:1.5, limanKiralari: [25, 50, 100, 200],   // 1, 2, 3, 4 limana sahipken
};

// ülke: renk, çatı, kule fiyatı, kale fiyatı (Mustafa'nın belirlediği değerler)
const ULKELER = {
  "Portekiz":  {renk:"#6b3f22", cati:"İberya",                kule:50,  kale:50},
  "İspanya":   {renk:"#e3a21a", cati:"İberya",                kule:50,  kale:50},
  "Rusya":     {renk:"#5f7f2e", cati:"Asya'nın Efendileri", kule:100, kale:100},
  "Japonya":   {renk:"#d9662b", cati:"Asya'nın Efendileri", kule:100, kale:100},
  "İngiltere": {renk:"#c0262d", cati:"Angevin",             kule:150, kale:150},
  "Fransa":    {renk:"#2f5fb3", cati:"Angevin",             kule:150, kale:150},
  "Venedik":   {renk:"#16807e", cati:"Mare Mercatorum",     kule:200, kale:200},

};

// tahtada kullanılan, biraz açılmış ülke renkleri
function renkOf(ulke) {
  const h = ULKELER[ulke].renk.slice(1), k = 0.28;
  return "#" + [0, 2, 4].map(i => Math.round(parseInt(h.substr(i, 2), 16) + (255 - parseInt(h.substr(i, 2), 16)) * k).toString(16).padStart(2, "0")).join("");
}
// kira: [boş, ülke tamsa, 1 kule, 2 kule, 3 kule, 4 kule, kale]
const S = (ad, ulke, fiyat, kira) => ({tur:"sehir", ad, ulke, fiyat, kira});
const L = ad => ({tur:"ticaret", ad});
const SANS = () => ({tur:"sans", ad:"Şans"});

// 32 kare (4 köşe + her kenarda 7), Başlangıç'tan itibaren sırayla.
// Satın alma fiyatları şimdilik GEÇİCİ.
const TAHTA = [
  {tur:"baslangic", ad:"BAŞLANGIÇ"},
  S("Macau","Portekiz",60,  [2,4,10,30,90,160,250]),
  S("Rio","Portekiz",60,    [2,4,10,30,90,160,250]),
  S("Lisboa","Portekiz",80, [4,8,20,60,180,320,450]),
  L("Ivory Coast"),
  S("Manila","İspanya",100, [6,12,30,90,270,400,550]),
  S("Mexico","İspanya",100, [6,12,30,90,270,400,550]),
  S("Madrid","İspanya",120, [8,16,40,100,300,450,600]),
  {tur:"surgun", ad:"SÜRGÜN"},
  S("Bakü","Rusya",180,      [14,28,70,200,550,750,950]),
  S("Petersburg","Rusya",180,[14,28,70,200,550,750,950]),
  S("Moskova","Rusya",200,   [16,32,80,220,600,800,1000]),
  SANS(),
  S("Osaka","Japonya",220,   [10,20,50,150,450,625,750]),
  L("Malaka"),
  S("Tokyo","Japonya",240,   [12,24,60,180,500,700,900]),
  {tur:"kervansaray", ad:"KERVANSARAY"},
  S("Victoria","İngiltere",260,[18,36,90,250,700,850,1000]),
  L("Cebelitarık"),
  S("London","İngiltere",280,  [20,40,100,300,750,900,1100]),
  SANS(),
  S("Alger","Fransa",300,    [22,44,110,330,800,950,1100]),
  S("Bordeaux","Fransa",300, [22,44,110,330,800,950,1100]),
  S("Paris","Fransa",320,    [24,48,120,360,850,1000,1200]),
  {tur:"kasif", ad:"KÂŞİF"},
  S("Candia","Venedik",340,  [26,52,130,390,900,1100,1250]),
  L("Alexandria"),
  S("Venezia","Venedik",360, [28,56,150,450,1000,1200,1400]),
  SANS(),
  S("Konstantiniyye","Roma",380,[40,70,175,450,1000,1300,1700]),
  {tur:"vergi", ad:"Vergi"},
  S("Roma","Roma",400,       [50,100,200,500,1200,1500,2000]),
];

const RS = `<svg class="r-em" viewBox="0 0 40 30"><text x="13" y="25" text-anchor="middle" font-family="RoE Serif" font-weight="700" font-size="28" fill="#3e1659">R</text><path d="M21 28L27 13M26.5 28L32.5 13" stroke="#c99a2e" stroke-width="2.6" stroke-linecap="round"/></svg>`;
const rSembol = (h = 20) => `<svg class="r-sembol" viewBox="0 0 40 30" style="height:${h}px;width:${h * 1.33}px"><text x="13" y="25" text-anchor="middle" font-family="RoE Serif" font-weight="700" font-size="28" fill="#3e1659">R</text><path d="M21 28L27 13M26.5 28L32.5 13" stroke="#c99a2e" stroke-width="2.6" stroke-linecap="round"/></svg>`;
function kartEtkisi(etki) {
  const [tur, d] = etki.split(":");
  const R = rSembol(20), e = t => `<span class="ke">${t}</span>`;
  switch (tur) {
    case "para": { const n = parseInt(d); return n >= 0 ? e(`Kasadan ${n} ${R} al`) : e(`Kasaya ${-n} ${R} ver`); }
    case "herkesten": return e(`Her oyuncudan ${d} ${R} al`);
    case "herkese": return e(`Her oyuncuya ${d} ${R} ver`);
    case "git": return e(`➜ ${d === "KÂŞİF" ? "Kâşif" : d === "BAŞLANGIÇ" ? "Başlangıç" : d}`);
    case "geri": return e(`${d} kare geri git`);
    case "surgun": return e("Sürgüne git");
    case "af": return e("Af mektubunu sakla");
    case "liman": return e("En yakın limana git");
    case "kule_vergisi": { const [k, l] = d.split(","); return e(`Kule başına ${k} ${R} ver`) + e(`Kale başına ${l} ${R} ver`); }
    case "dukat": return e(`Kasadan ${d} Dukat al`);
  }
  return "";
}
function sansKartHTML(kart) {
  const dukatli = kart.etki.startsWith("dukat");
  return `<div class="sans-kart"><div class="sk-ust">ŞANS</div>
    <div class="sk-cerceve">${(KART_RESIM[kart.resim] || (() => ""))()}</div>
    <div class="sk-metin">${kart.metin}</div>
    <div class="sk-etki">${kartEtkisi(kart.etki)}</div>
    ${dukatli ? `<div class="sk-deger"><img src="${DUKAT_IMG}" alt=""> 1 Dukat = ${DUKAT_DEGERI} ${rSembol(18)}</div>` : ""}</div>`;
}

};
const OYUNCU_RENKLERI = ["#b8322a","#2a5aa8","#2f8a4a","#c9901e","#7b3fa0","#178a8a"];

/* =====================================================================
   OYUN DURUMU
   ===================================================================== */
let G = null;          // oyun
let bekleyen = null;   // oyuncudan beklenen karar {tur, veri, coz}
let mesgul = false;    // animasyon sürüyor mu
let secili = null;     // tıklanıp bilgisi gösterilen kare
let zarDegerleri = [1, 1], zarDonuyor = false;

const uyku = ms => new Promise(r => setTimeout(r, ms));
const para = n => `<span class="tutar">${n.toLocaleString("tr-TR")}${RS}</span>`;
const suanki = () => G.oyuncular[G.sira];
const oyuncu = id => G.oyuncular[id];
const karistir = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function yeniOyun(ayarlar) {
  G = {
    oyuncular: ayarlar.map((a, i) => ({id:i, ad:a.ad, piyon:a.piyon, bot:a.bot, renk:OYUNCU_RENKLERI[i],
      para:AYAR.baslangicParasi, konum:0, surgunde:false, surgunTur:0, af:0, iflas:false})),
    kareler: TAHTA.map((t, i) => ({...t, i, sahip:null, seviye:0})),
    sira: 0, faz: "zar", cift: 0, deste: karistir([...SANS_KARTLARI]), desteI: 0, gunluk: [], bitti: false,
  };
  bekleyen = null; mesgul = false; secili = null; sonIstem = "";
  for (let i = 0; i < 4; i++) tapuIzi[i] = null;
  log(`Oyun başladı! Herkes ${para(AYAR.baslangicParasi)} ile yola çıkıyor.`);
  render(); botDevam();
}

function log(m) { G.gunluk.unshift(m); if (G.gunluk.length > 80) G.gunluk.pop(); }

/* ---------- kurallar ---------- */
const ulkeKareleri = u => G.kareler.filter(k => k.ulke === u);
const tamSet = (pid, u) => ulkeKareleri(u).every(k => k.sahip === pid);
const fiyatOf = k => k.tur === "ticaret" ? AYAR.limanFiyati : k.fiyat;
const yapiMaliyeti = (k, seviye) => seviye === 5 ? ULKELER[k.ulke].kale : ULKELER[k.ulke].kule;

// çatı (İberya, Angevin…) kurulduysa o çatının bütün kiraları 1.5 katı
const catiOf = k => k.tur === "ticaret" ? "Mare Mercatorum" : k.tur === "sehir" ? ULKELER[k.ulke].cati : null;
const catiKurulu = k => k.sahip !== null && catiOf(k) !== null && catiTam(k.sahip, catiOf(k));
function kira(k) {
  let m;
  if (k.tur === "ticaret") {
    const n = G.kareler.filter(x => x.tur === "ticaret" && x.sahip === k.sahip).length;
    m = AYAR.limanKiralari[n - 1];
  } else m = k.seviye === 0 ? (tamSet(k.sahip, k.ulke) ? k.kira[1] : k.kira[0]) : k.kira[k.seviye + 1];
  return catiKurulu(k) ? Math.round(m * AYAR.catiCarpani) : m;
}
// inşa sadece bu tur üzerine gelinen kendi şehrinde yapılabilir
function insaEdilebilir(p, k) {
  return k.tur === "sehir" && k.sahip === p.id && G.insaKare === k.i && suanki() === p && tamSet(p.id, k.ulke) && k.seviye < 5 &&
    p.para >= yapiMaliyeti(k, k.seviye + 1);
}
function satilabilir(p, k) {
  return k.sahip === p.id && k.seviye > 0;
}
function insaEt(p, k) {
  const m = yapiMaliyeti(k, k.seviye + 1);
  p.para -= m; k.seviye++;
  log(`${p.ad}, ${k.ad} şehrine ${k.seviye === 5 ? "kale" : "gözcü kulesi"} dikti (−${para(m)}).`);
}
function yapiSat(p, k) {
  const geri = Math.floor(yapiMaliyeti(k, k.seviye) / 2);
  const ad = k.seviye === 5 ? "kalesini" : "bir gözcü kulesini";
  k.seviye--; p.para += geri;
  log(`${p.ad}, ${k.ad} şehrindeki ${ad} sattı (+${para(geri)}).`);
}
function servet(p) {
  let t = p.para;
  for (const k of G.kareler) if (k.sahip === p.id) {
    t += fiyatOf(k);
    for (let s = 1; s <= k.seviye; s++) t += yapiMaliyeti(k, s);
  }
  return t;
}

// para öde; yetmezse yapılar yarı fiyatına satılır, yine yetmezse iflas
function ode(p, m, alacakli) {
  while (p.para < m) {
    const aday = G.kareler.filter(k => satilabilir(p, k)).sort((a, b) => b.seviye - a.seviye)[0];
    if (!aday) break;
    yapiSat(p, aday);
  }
  if (p.para >= m) { p.para -= m; if (alacakli) alacakli.para += m; return true; }
  if (alacakli) alacakli.para += p.para;
  p.para = 0; iflasEt(p); return false;
}
function iflasEt(p) {
  p.iflas = true; p.surgunde = false;
  for (const k of G.kareler) if (k.sahip === p.id) { k.sahip = null; k.seviye = 0; }
  log(`💀 ${p.ad} iflas etti! Şehirleri bankaya döndü.`);
  const kalan = G.oyuncular.filter(o => !o.iflas);
  if (kalan.length === 1) oyunuBitir();
}
function surguneGonder(p) {
  p.konum = SURGUN_I; p.surgunde = true; p.surgunTur = 0; G.cift = 0;
  log(`⛓ ${p.ad} sürgüne gönderildi!`);
}

/* ---------- hareket ---------- */
async function ilerle(p, n, hiz = 280) {
  for (let s = 0; s < n; s++) {
    p.konum = (p.konum + 1) % N;
    if (p.konum === 0) { p.para += AYAR.baslangicBonusu; log(`${p.ad} Başlangıç karesinden geçti: +${para(AYAR.baslangicBonusu)}`); }
    render(); await uyku(hiz);
  }
}
async function geriGit(p, n) {
  for (let s = 0; s < n; s++) { p.konum = (p.konum + N - 1) % N; render(); await uyku(280); }
}
async function kareyeGit(p, hedef) {
  const n = (hedef - p.konum + N) % N;
  await ilerle(p, n, 150);
}

/* ---------- zar ---------- */
async function zarAnimasyonu() {
  const sonuc = [1 + Math.floor(Math.random() * 6), 1 + Math.floor(Math.random() * 6)];
  zarDonuyor = true; zarTur++; render();
  { const v = document.getElementById("varis"); if (v) { v.classList.remove("goster"); v.innerHTML = ""; } }
  sonuc.forEach((n, i) => {
    const [ax, ay] = YUZ_ACI[n];
    const ekX = 360 * (2 * zarTur + i + 1), ekY = 360 * (2 * zarTur + (i ? 2 : 1));   // her atışta ileri doğru birkaç tur döner
    const kup = document.getElementById("kup" + i), sahne = document.getElementById("zs" + i);
    kup.style.transform = `rotateX(${ax + ekX}deg) rotateY(${ay + ekY}deg)`;

// sadeleştirilmiş bayraklar: kutu = [[x0,y0],[x1,y1]], nok = haritadaki şehir noktaları
function bayrakSVG(ulke, k, nok) {
  const [[x0, y0], [x1, y1]] = k, w = x1 - x0, h = y1 - y0, cx = x0 + w / 2, cy = y0 + h / 2;
  const rect = (x, y, ww, hh, f) => `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="${f}"/>`;
  switch (ulke) {
    case "Portekiz": return rect(x0, y0, w * .4, h, "#046a38") + rect(x0 + w * .4, y0, w * .6, h, "#da291c") +
      `<circle cx="${x0 + w * .4}" cy="${cy}" r="${w * .22}" fill="none" stroke="#ffe900" stroke-width="${w * .06}"/>
       <path d="M${x0 + w * .3} ${y0 + h * .42}h${w * .2}v${h * .12}q-${w * .1} ${h * .1}-${w * .2} 0z" fill="#fff" stroke="#da291c" stroke-width="1"/>`;
    case "İspanya": return rect(x0, y0, w, h, "#aa151b") + rect(x0, y0 + h * .25, w, h * .5, "#f1bf00") +
      `<path d="M${x0 + w * .38} ${y0 + h * .38}h${w * .12}v${h * .16}q-${w * .06} ${h * .1}-${w * .12} 0z" fill="#aa151b" opacity=".85"/>`;
    case "Rusya": return rect(x0, y0, w, h / 3, "#fff") + rect(x0, y0 + h / 3, w, h / 3, "#0039a6") + rect(x0, y0 + 2 * h / 3, w, h / 3 + 1, "#d52b1e");
    case "Japonya": { const t = nok.find(n => n.ad === "Tokyo") || {x: cx, y: cy};
      return rect(x0, y0, w, h, "#fff") + `<circle cx="${t.x - 4}" cy="${t.y - 4}" r="${Math.max(w, h) * .14}" fill="#bc002d"/>`; }
    case "İngiltere": // Birleşik Krallık bayrağı (Union Jack)
      return `<g transform="translate(${x0} ${y0}) scale(${w / 60} ${h / 30})"><rect width="60" height="30" fill="#012169"/>
        <path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/><path d="M0 0L60 30M60 0L0 30" stroke="#c8102e" stroke-width="2"/>
        <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10"/><path d="M30 0v30M0 15h60" stroke="#c8102e" stroke-width="6"/></g>`;
    case "Fransa": return rect(x0, y0, w / 3, h, "#0055a4") + rect(x0 + w / 3, y0, w / 3, h, "#fff") + rect(x0 + 2 * w / 3, y0, w / 3 + 1, h, "#ef4135");
    case "Roma": return rect(x0, y0, w, h, "#8b1a1a") +
      `<text x="${cx + w * .05}" y="${cy + h * .02}" text-anchor="middle" font-family="RoE Serif" font-weight="700" font-size="${w * .2}" fill="#f3c14a" transform="rotate(48 ${cx} ${cy})">SPQR</text>`;
    case "Konstantiniyye": { const s = h * .1;
      return rect(x0, y0, w, h, "#9e1b1b") + rect(cx - s * .35, y0, s * .7, h, "#f3c14a") + rect(x0, cy - s * .35, w, s * .7, "#f3c14a") +
        [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([dx, dy]) => `<text x="${cx + dx * w * .14}" y="${cy + dy * h * .22 + s * .4}" text-anchor="middle" font-family="RoE Serif" font-weight="700" font-size="${s * 1.3}" fill="#f3c14a" ${dx < 0 ? `transform="scale(-1,1) translate(${-2 * (cx + dx * w * .14)},0)"` : ""}>B</text>`).join(""); }
  }
  return rect(x0, y0, w, h, ULKELER[ulke] ? ULKELER[ulke].renk : "#888");
}

function venedikSVG(H, resim = VENEDIK_ASLAN, zemin = "#c4081a") {
  const b = Object.keys(H.bolgeler);
  const tum = b.map(a => H.kutular[a]).reduce((t, k) => [[Math.min(t[0][0], k[0][0]), Math.min(t[0][1], k[0][1])], [Math.max(t[1][0], k[1][0]), Math.max(t[1][1], k[1][1])]]);
  return `<svg class="kt-harita venedik-harita${H.tek ? " roma-harita" : ""}" viewBox="0 0 ${H.W} ${H.H}" style="aspect-ratio:${H.W}/${H.H}">
    <defs><clipPath id="vk"><path d="${H.arka}"/></clipPath>${b.map((a, i) => `<clipPath id="vb${i}"><path d="${H.bolgeler[a]}"/></clipPath>`).join("")}</defs>
    <rect class="kh-deniz" width="${H.W}" height="${H.H}" rx="6"/>
    <path class="kh-arka" d="${H.arka}"/>
    ${b.map((a, i) => { const [[x0, y0], [x1, y1]] = H.tek ? tum : H.kutular[a], w = Math.max(x1 - x0, 14), h = Math.max(y1 - y0, 14);
      return `<g class="kh-bayrak" style="animation-delay:${(H.tek ? 2.3 : 1.7) + i * .25}s"><g clip-path="url(#vb${i})"><rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="${zemin}"/><image href="${resim}" x="${(x0 + x1) / 2 - w / 2}" y="${(y0 + y1) / 2 - h / 2}" width="${w}" height="${h}" preserveAspectRatio="xMidYMid slice"/></g></g>`; }).join("")}
    ${b.map((a, i) => `<path class="kh-cizgi" vector-effect="non-scaling-stroke" pathLength="1" d="${H.bolgeler[a]}" style="animation-delay:${i * .25}s"/>`).join("")}
    ${H.noktalar.map((n, i) => `<g class="kh-nokta" style="animation-delay:${2.4 + i * .2}s;transform-origin:${n.x}px ${n.y}px"><circle cx="${n.x}" cy="${n.y}" r="3.6" fill="#f3c14a" stroke="#3e1659" stroke-width="1.3"/>
      <text x="${n.x}" y="${n.y - 7}" text-anchor="middle" class="kh-etiket">${n.ad}</text></g>`).join("")}
  </svg>`;
}
function haritaSVG(cati, sadece = null) {
  if (cati === "Venedik" || sadece === "Venedik") return venedikSVG(HARITALAR_VENEDIK);
  if (cati === "Roma") return venedikSVG(HARITALAR_ROMA, ROMA_SANCAK, "#a01c1e");
  const H = HARITALAR[cati]; if (!H) return "";
  const ulkeler = Object.keys(H.ulkeler).filter(u => !sadece || u === sadece);
  let noktalar = H.noktalar;
  if (sadece === "Venedik") noktalar = noktalar.filter(n => n.tur === "sehir");
  else if (sadece) noktalar = noktalar.filter(n => G.kareler.some(k => k.ad === n.ad && k.ulke === sadece));
  const merkez = H.noktalar.find(n => n.ad === "Venezia");
  const rotalar = cati === "Mare Mercatorum" && merkez ? noktalar.filter(n => n !== merkez).map((n, i) => {
    const mx = (merkez.x + n.x) / 2, my = (merkez.y + n.y) / 2 - Math.hypot(n.x - merkez.x, n.y - merkez.y) * .18;
    return `<path class="kh-rota" pathLength="1" d="M${merkez.x} ${merkez.y}Q${mx.toFixed(1)} ${my.toFixed(1)} ${n.x} ${n.y}" style="animation-delay:${.9 + i * .3}s"/>`; }).join("") : "";
  const gec = ulkeler.length ? 1.5 + ulkeler.length * .45 : 1.0;
  // tek ülke formlanınca harita o ülkeye yakınlaşır (ör. Japonya)
  let vb = [0, 0, H.W, H.H], z = 1;
  if (sadece && H.kutular[sadece]) {
    const [[x0, y0], [x1, y1]] = H.kutular[sadece];
    let w = (x1 - x0) * 1.25, h = (y1 - y0) * 1.12;
    if (w / h < H.W / H.H) w = h * H.W / H.H; else h = w * H.H / H.W;
    if (w < H.W * .7) { z = w / H.W; vb = [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h]; }
  }
  const alta = ["Alexandria", "Osaka"];
  return `<svg class="kt-harita${z < 1 ? " yakin" : ""}" viewBox="${vb.map(v => +v.toFixed(1)).join(" ")}" style="aspect-ratio:${H.W}/${H.H};--z:${z}">
    <defs>${ulkeler.map((u, i) => `<clipPath id="kh${i}"><path d="${H.ulkeler[u]}"/></clipPath>`).join("")}</defs>
    <rect class="kh-deniz" width="${H.W}" height="${H.H}" rx="6"/>
    ${H.arka ? `<path class="kh-arka" d="${H.arka}"/>` : ""}
    ${ulkeler.map((u, i) => `<g class="kh-bayrak" style="animation-delay:${1.5 + i * .45}s" clip-path="url(#kh${i})">${bayrakSVG(u, H.kutular[u], H.noktalar)}</g>`).join("")}
    ${ulkeler.map((u, i) => `<path class="kh-cizgi" vector-effect="non-scaling-stroke" pathLength="1" d="${H.ulkeler[u]}" style="animation-delay:${i * .35}s"/>`).join("")}
    ${rotalar}
    ${cati === "Mare Mercatorum" && !sadece ? `<g class="kh-bayrak" style="animation-delay:2.6s"><image href="${VENEDIK_BAYRAK}" x="${H.W - 92}" y="8" width="84" height="42"/><rect x="${H.W - 92}" y="8" width="84" height="42" fill="none" stroke="#3b2f22" stroke-width="1.2"/></g>` : ""}
    ${noktalar.map((n, i) => `<g class="kh-nokta" style="animation-delay:${gec + i * .15}s;transform-origin:${n.x}px ${n.y}px">
      ${n.tur === "liman" ? `<circle cx="${n.x}" cy="${n.y}" r="${4.2 * z}" fill="#16807e" stroke="#fff" stroke-width="${1.4 * z}"/>` : `<circle cx="${n.x}" cy="${n.y}" r="${3.6 * z}" fill="#f3c14a" stroke="#3e1659" stroke-width="${1.3 * z}"/>`}
      <text x="${n.x}" y="${alta.includes(n.ad) ? n.y + 13 * z : n.y - 7 * z}" text-anchor="middle" class="kh-etiket" style="font-size:${9 * z}px;stroke-width:${2.5 * z}px">${n.ad}</text></g>`).join("")}
  </svg>`;
}

const catiUlkeleri = c => Object.keys(ULKELER).filter(u => ULKELER[u].cati === c);

async function formKontrol(p) {
  p.formlar = p.formlar || [];
  let yeniUlke = null, yeniCati = null;
  for (const u of Object.keys(ULKELER)) if (tamSet(p.id, u) && !p.formlar.includes("u:" + u)) { p.formlar.push("u:" + u); yeniUlke = u; }
  for (const c of TUM_CATILAR()) if (catiTam(p.id, c) && !p.formlar.includes("c:" + c)) { p.formlar.push("c:" + c); yeniCati = c; }

}

  const ulkeler = tur === "cati" ? catiUlkeleri(ad) : [ad];
  const renkler = ulkeler.map(u => ULKELER[u].renk);
  const sehirler = G.kareler.filter(k => ulkeler.includes(k.ulke) || (tur === "cati" && ad === "Mare Mercatorum" && k.tur === "ticaret")).map(k => k.ad);
  const buyuk = tur === "cati";
  const haritaVar = buyuk ? !!HARITALAR[ad] : (ad === "Venedik" || Object.values(HARITALAR).some(h => h.ulkeler[ad]));
  let kivilcim = "";
  for (let i = 0; i < (buyuk ? 70 : 30); i++) {
    const r = buyuk ? (i % 3 === 0 ? "#f3d27a" : renkler[i % renkler.length]) : (i % 2 ? "#f3d27a" : renkler[0]);
    kivilcim += `<i style="left:${Math.random() * 100}%;background:${r};animation-delay:${(Math.random() * 1.2).toFixed(2)}s;animation-duration:${(2 + Math.random() * 1.8).toFixed(2)}s;--don:${Math.round(Math.random() * 720 - 360)}deg"></i>`;
  }
  el.innerHTML = `<div class="kt-perde ${buyuk ? "buyuk" : "kucuk"}">
    <div class="kt-isinlar"></div>
    <div class="kt-kart" style="--r1:${renkler[0]};--r2:${renkler[1] || renkler[0]}">
      <div class="kt-serit"></div>
      <div class="kt-ust-yazi">${buyuk ? "BİR ÇATI KURULDU" : "ÜLKE BİRLEŞTİ"}</div>
      ${haritaVar ? (buyuk ? haritaSVG(ad) : haritaSVG(Object.keys(HARITALAR).find(c => c === "Mare Mercatorum" ? ad === "Venedik" : HARITALAR[c].ulkeler[ad]), ad)) : `<div class="kt-piyon">${piyonHTML(p)}</div>`}
      <div class="kt-baslik${(FORM_ADI[ad] || ad).length > 10 ? " uzun" : ""}">${haritaVar ? `<span class="kt-mini">${piyonHTML(p)}</span>` : ""}${buyuk ? "👑 " : "⚑ "}${(FORM_ADI[ad] || ad).toLocaleUpperCase("tr")}</div>
      <div class="kt-alt-yazi"><b>${p.ad}</b> ${buyuk ? "imparatorluğunu kurdu!" : "bütün şehirlere sahip!"}</div>
      <div class="kt-sehirler">${sehirler.join(" · ")}</div>
      <div class="kt-not">${buyuk ? "Bu çatıdaki bütün kiraların 1.5 katına çıktı!" : "Artık burada kule dikebilirsin."}</div>
    </div>
    <div class="kt-kivilcim">${kivilcim}</div></div>`;
  await uyku(buyuk ? (haritaVar ? 5800 : 4200) : (haritaVar ? 4000 : 2600));
  el.innerHTML = "";
}

/* ---------- karar bekleme ---------- */
function sor(tur, veri) {
  return new Promise(coz => {
    bekleyen = {tur, veri, coz};
    render();
    const p = suanki();
    if (p.bot) setTimeout(() => cevapla(botKarari(p, tur, veri)), tur === "kart" ? 3000 : 1600);
  });
}
function cevapla(v) {
  if (!bekleyen) return;
  const c = bekleyen.coz; bekleyen = null; c(v);
}

/* ---------- bilgisayar oyuncusu ---------- */
function botKarari(p, tur, veri) {
  if (tur === "satin") return p.para - fiyatOf(veri.k) >= 300;
  if (tur === "kasif") return null;
  return true;
}
function botDevam() {
  if (!G || G.bitti) return;
  const p = suanki();
  if (!p.bot || mesgul || bekleyen) return;
  setTimeout(() => {
    if (G.bitti || suanki() !== p || mesgul || bekleyen) return;
    // önce inşa
    for (let tekrar = 0; tekrar < 6; tekrar++) {
      const aday = G.kareler.filter(k => insaEdilebilir(p, k) && p.para - yapiMaliyeti(k, k.seviye + 1) >= 500)
        .sort((a, b) => b.fiyat - a.fiyat)[0];
      if (!aday) break;
      insaEt(p, aday);
    }
    if (G.faz === "zar" || G.faz === "tekrar") {
      if (p.surgunde && G.faz === "zar") {
        if (p.af > 0) { afKullan(); return; }
        if (p.para > 800) { surguneOde(); return; }
      }
      zarAt();
    } else if (G.faz === "bitti") turuBitir();
  }, 1500);
}

/* ---------- oyun sonu ---------- */
function oyunuBitir() {
  G.bitti = true; bekleyen = null;
  const sira = [...G.oyuncular].sort((a, b) => (a.iflas - b.iflas) || servet(b) - servet(a));
  log(`🏆 Oyun bitti! Kazanan: ${sira[0].ad}`);
  render();
  pencereAc(`<h2>Oyun Bitti</h2>
    <p style="text-align:center;font-size:20px">🏆 <b>${sira[0].ad}</b> imparatorluğun efendisi oldu!</p>
    <ol class="sonuc">${sira.map(o => `<li>${o.ad} — ${o.iflas ? "iflas etti" : "servet: " + para(servet(o))}</li>`).join("")}</ol>
    <p class="not">Servet = nakit + şehirlerin fiyatı + dikilen kule ve kalelerin maliyeti.</p>
    <div style="text-align:center;margin-top:12px"><button class="btn altin" onclick="kurulumGoster()">Yeni oyun</button>
    <button class="btn gri" onclick="pencereKapat()">Tahtaya bak</button></div>`);
}
function oyunuBitirSor() {
  if (!G || G.bitti) return;
  pencereAc(`<h2>Oyunu bitir?</h2><p style="text-align:center">Oyun şimdi biter ve en zengin oyuncu kazanır.</p>
    <div style="text-align:center"><button class="btn" onclick="pencereKapat();oyunuBitir()">Evet, bitir</button>
    <button class="btn gri" onclick="pencereKapat()">Devam et</button></div>`);
}

function konumGrid(i) {
  const K = KENAR, M = K + 1;   // K: köşeden köşeye adım, M: ızgara boyu
  if (i === 0) return [M, M, "kose"];
  if (i < K) return [M, M - i, "alt"];
  if (i === K) return [M, 1, "kose"];
  if (i < 2 * K) return [M - (i - K), 1, "sol"];
  if (i === 2 * K) return [1, 1, "kose"];
  if (i < 3 * K) return [1, 1 + (i - 2 * K), "ust"];
  if (i === 3 * K) return [1, M, "kose"];
  return [1 + (i - 3 * K), M, "sag"];
}

  baslangic:   {simge:"🏁", alt:`Geçince +${AYAR.baslangicBonusu}`},
  surgun:      {simge:"⛓️", alt:"Ziyaret"},

const piyonSVG = ad => `<img src="${PIYONLAR[ad]}" alt="${ad}" draggable="false">`;
function piyonHTML(o, ekSinif = "") {
  return `<div class="piyon ${ekSinif}" style="--pr:${o.renk}" title="${o.ad} (${o.piyon})">${piyonSVG(o.piyon)}</div>`;
}

const adSinif = ad => ad.length >= 12 ? " cok-uzun" : ad.length >= 8 ? " uzun" : "";
function tahtaKur() {

function kareTikla(i) {

  if (k.tur === "sehir") {
    // tapu kartı: renk bandı, şehir adı, fiyat, kule/kale kiraları, altta yapı maliyetleri
    const u = ULKELER[k.ulke];
    const kx = v => v;
    const satirlar = [["", "Kira", kx(k.kira[0])], ["", "Tam set kira", kx(k.kira[1])], ["1", "Kule", kx(k.kira[2])], ["2", "Kule", kx(k.kira[3])], ["3", "Kule", kx(k.kira[4])], ["4", "Kule", kx(k.kira[5])], ["", "Kale", kx(k.kira[6])]];
    const simdi = k.sahip === null ? -1 : k.seviye > 0 ? k.seviye + 1 : tamSet(k.sahip, k.ulke) ? 1 : 0;
    return `<div class="tapu-kart">
      <div class="tk-bant" style="background:${renkOf(k.ulke)}"></div>

      <div class="tk-alt-baslik">Yapı fiyatları</div><div class="tk-alt"><span>Her kule ${u.kule}</span><span>Kale ${u.kale}</span></div>
    </div>${k.sahip === null ? "" : `<div class="tk-sahip">Sahibi: <b>${oyuncu(k.sahip).ad}</b></div>`}`;
  }
  if (k.tur === "ticaret") {
    // liman kartı: şehir tapusuyla aynı düzen, renk bandında çapa ve liman simgesi
    const n = k.sahip === null ? -1 : G.kareler.filter(x => x.tur === "ticaret" && x.sahip === k.sahip).length - 1;
    const yazi = ["1 liman", "2 liman", "3 liman", "4 liman"];
    return `<div class="tapu-kart liman-kart">
      <div class="tk-bant lk-bant"></div>
      <div class="tk-ad">${k.ad}</div>
      <div class="tk-fiyat">${para(AYAR.limanFiyati)}</div>
      <div class="tk-baslik">Liman kirası</div><table class="tk-kira">${AYAR.limanKiralari.map((r, j) => `<tr class="${j === n ? "simdi" : ""}"><td class="tk-no">${j + 1}</td><td>Liman</td><td>${r}</td></tr>`).join("")}</table>
      <div class="tk-alt-baslik">Mare Mercatorum</div><div class="tk-alt lk-not">Venedik şehirleri ve 4 liman<br>aynı oyuncudaysa çatı kurulur</div>
    </div>${k.sahip === null ? "" : `<div class="tk-sahip">Sahibi: <b>${oyuncu(k.sahip).ad}</b></div>`}`;
  }
  const aciklama = {baslangic:`Her geçişte +${para(AYAR.baslangicBonusu)}.`, surgun:"Sadece ziyaret. Sürgüne şans kartıyla ya da üst üste 3 çiftle gidilir.",
    kervansaray:"Dinlenme karesi, bir şey olmaz.", kasif:`${para(AYAR.kasifUcreti)} ödeyip tahtada istediğin kareye gidebilirsin.`,
    sans:"Bir şans kartı çekersin.", vergi:`${para(AYAR.vergi)} gümrük vergisi ödersin.`}[k.tur];
  return `<div class="kutu"><h3>${k.ad}</h3>${aciklama}</div>`;
}

const yapiHTML = k => !k.seviye || k.sahip === null ? "" : k.seviye === 5 ? kaleSVG(oyuncu(k.sahip).renk) : kuleSVG(oyuncu(k.sahip).renk).repeat(k.seviye);

function render() {
  if (!G) return;
  // kareler
  G.kareler.forEach(k => {
    const d = document.getElementById("k" + k.i);
    const sb = d.querySelector(".sahip");
    if (k.sahip !== null) { sb.style.display = "block"; sb.style.setProperty("--sahip-renk", oyuncu(k.sahip).renk); }
    else sb.style.display = "none";
    { const y = d.querySelector(".yapilar"), h = yapiHTML(k); if (y.dataset.iz !== h) { y.innerHTML = h; y.dataset.iz = h; } }
    d.querySelector(".piyonlar").innerHTML = G.oyuncular.filter(o => !o.iflas && o.konum === k.i)
      .map(o => piyonHTML(o, o === suanki() ? "aktif" : "")).join("");
    const kasifSec = bekleyen && bekleyen.tur === "kasif" && !suanki().bot && k.i !== KASIF_I;
    d.classList.toggle("secilebilir", !!kasifSec && bekleyen.hedefAday === k.i);
  });

  // tahtanın ortası: amblem, hemen altında butonlar, sonra zarlar
  const p = suanki();
  let eylem = "";
  if (G.bitti) eylem = `<button class="btn altin" onclick="kurulumGoster()">Yeni oyun</button>`;
  else if (!p.bot && !bekleyen && !mesgul) {
    if (G.faz === "zar") {
      if (p.surgunde) {
        eylem = `<button class="btn altin" onclick="zarAt()">🎲 Çift için at (${p.surgunTur + 1}/${AYAR.surgunMaksTur})</button>
          <button class="btn" ${p.para < AYAR.surgunCikisUcreti ? "disabled" : ""} onclick="surguneOde()">${AYAR.surgunCikisUcreti} öde, çık</button>
          ${p.af ? `<button class="btn" onclick="afKullan()">Af mektubu</button>` : ""}`;
      } else eylem = `<button class="btn altin" onclick="zarAt()">🎲 Zar at</button>`;
    } else if (G.faz === "tekrar") eylem = `<button class="btn altin" onclick="zarAt()">🎲 Tekrar at</button>`;
    else if (G.faz === "bitti") eylem = `<button class="btn altin" onclick="turuBitir()">Turu bitir ➜</button>`;
    const ik = G.insaKare !== null && G.insaKare !== undefined ? G.kareler[G.insaKare] : null;
    if (ik && insaEdilebilir(p, ik)) eylem += `<button class="btn" onclick="insaTikla(${ik.i})">${ik.seviye === 4 ? "🏰 Kale dik" : "♜ Kule dik"} · ${para(yapiMaliyeti(ik, ik.seviye + 1))}</button>`;
  }
  document.getElementById("merkezBtn").innerHTML = eylem;
  const [z1, z2] = zarDegerleri;
  document.getElementById("zarToplam").innerHTML = G.zarAtildi && !zarDonuyor ? `${z1} + ${z2} = <b>${z1 + z2}</b>${z1 === z2 ? ' <span class="cift">ÇİFT!</span>' : ""}` : "";
  document.getElementById("sonOlay").innerHTML = G.gunluk[0] || "";

  // tahtanın üstünde açılan kart (şans, satın alma, kâşif, şehir bilgisi)
  let kutu = "", kutuBtn = "";
  if (bekleyen) {
    const v = bekleyen.veri;
    if (bekleyen.tur === "satin") {
      kutu = tapuHTML(v.k);
      kutuBtn = p.bot ? `<i>${p.ad} düşünüyor…</i>` :
        `<button class="btn altin" onclick="cevapla(true)">Satın al · ${para(fiyatOf(v.k))}</button><button class="btn gri" onclick="cevapla(false)">Geç</button>`;
    } else if (bekleyen.tur === "kart") {
      kutu = `<div class="sans-cevir"><div class="sans-ic"><div class="sans-arka">${SIMGELER.sans}<div>ŞANS</div></div><div class="sans-on">${sansKartHTML(v.kart)}</div></div></div>`;
      kutuBtn = p.bot ? `<i>${p.ad} kartı okuyor…</i>` : `<button class="btn altin" onclick="cevapla(true)">Tamam</button>`;
    } else if (bekleyen.tur === "kasif") {
      const h = bekleyen.hedefAday;
      kutu = `<div class="kutu"><h3>Kâşif</h3>${para(AYAR.kasifUcreti)} ödeyip tahtada istediğin kareye gidebilirsin.<br>
        <b>${h !== undefined ? "Hedef: " + G.kareler[h].ad : "Tahtadan bir kareye tıkla."}</b></div>`;
      kutuBtn = p.bot ? `<i>${p.ad} düşünüyor…</i>` :
        `<button class="btn altin" ${h === undefined ? "disabled" : ""} onclick="cevapla(${h})">Yolculuğa çık</button><button class="btn gri" onclick="cevapla(null)">Kalmak istiyorum</button>`;
    }
  } else if (secili !== null) {
    kutu = tapuHTML(G.kareler[secili]);
    kutuBtn = `<button class="btn gri" onclick="secili=null;render()">Kapat</button>`;
  }
  const istem = document.getElementById("istem");
  const istemAnahtar = kutu ? (bekleyen ? bekleyen.tur + ":" + (bekleyen.veri.k ? bekleyen.veri.k.i : bekleyen.veri.kart ? bekleyen.veri.kart.metin : "") : "s:" + secili) : "";
  if (istemAnahtar !== sonIstem || !kutu) {
    istem.innerHTML = kutu ? `<div class="istem-ic giris ${bekleyen && bekleyen.tur === "kasif" ? "kucuk" : ""}">${kutu}<div class="eylemler" id="istemBtn">${kutuBtn}</div></div>` : "";
    sonIstem = istemAnahtar;
  } else {
    const ic = istem.querySelector(".istem-ic"); if (ic) { ic.querySelector("#istemBtn").innerHTML = kutuBtn; if (bekleyen && bekleyen.tur === "kasif") { const kk = ic.querySelector(".kutu"); const yeni = document.createElement("div"); yeni.innerHTML = kutu; kk.replaceWith(yeni.firstElementChild); } }
  }
  istem.classList.toggle("acik", !!kutu);

  // masadaki tapular: her oyuncunun köşesinin altında
  for (let i = 0; i < 4; i++) tapuAlaniCiz(i);


  // dört köşe: 0 sol üst, 1 sağ üst, 2 sol alt, 3 sağ alt
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById("koltuk" + i), o = G.oyuncular[i];
    if (!o) { el.innerHTML = ""; el.className = "koltuk bos k" + i; continue; }
    const sirada = o === p && !G.bitti;
    el.className = `koltuk k${i} ${sirada ? "sirada" : ""} ${o.iflas ? "iflas" : ""}`;
    el.style.setProperty("--pr", o.renk);
    el.innerHTML = `<div class="kt-logo">${piyonHTML(o, sirada ? "aktif" : "")}</div>
      <div class="kt-para">${para(o.para)}</div>
      <div class="kt-isim">${o.ad}</div>
      ${catilarOf(o).map(c => `<div class="kt-cati">👑 ${c}</div>`).join("")}
      <div class="kt-durum">${o.iflas ? "İflas etti" : [o.surgunde ? `⛓ Sürgünde (${o.surgunTur}/${AYAR.surgunMaksTur})` : "", o.af ? `📜 Af mektubu ×${o.af}` : ""].filter(Boolean).join(" · ")}</div>`;
  }
  if (insaAcik) insaPenceresi();
}

let insaAcik = false;
function insaPenceresi() {
  const p = suanki();
  if (!G || G.bitti || p.bot) { insaAcik = false; return; }
  insaAcik = true;
  const ulkeler = Object.keys(ULKELER).filter(u => tamSet(p.id, u));
  const izin = !mesgul && !bekleyen;
  pencereAc(`<h2>İnşa et / sat</h2><p class="not" style="text-align:center">${p.ad} · ${para(p.para)} · Kuleler eşit dağılmalı; 4 kuleden sonra kale gelir. Yapılar yarı fiyatına satılır.</p>
    ${ulkeler.map(u => ulkeKareleri(u).map(k => {
      const sonraki = k.seviye < 5 ? yapiMaliyeti(k, k.seviye + 1) : null;
      return `<div class="insa-satir"><span class="renk-kutu" style="background:${renkOf(u)}"></span><span class="ad">${k.ad}</span>
        <span>${k.seviye === 5 ? "🏰" : "♜".repeat(k.seviye) || "—"}</span><span class="not">kira ${kira(k)}</span>
        <button ${izin && insaEdilebilir(p, k) ? "" : "disabled"} onclick="insaTikla(${k.i})">+ ${sonraki ?? ""}</button>
        <button ${izin && satilabilir(p, k) ? "" : "disabled"} onclick="satTikla(${k.i})">− ${k.seviye ? Math.floor(yapiMaliyeti(k, k.seviye) / 2) : ""}</button></div>`;
    }).join("")).join("")}
    <div style="text-align:center;margin-top:12px"><button class="btn" onclick="insaAcik=false;pencereKapat()">Bitti</button></div>`);
}

let sonIstem = "";
const tapuIzi = {};
function miniTapu(k, yeni) {
  const renk = k.tur === "sehir" ? renkOf(k.ulke) : "#16807e";
  const yapi = yapiHTML(k);
  return `<div class="mini-tapu ${yeni ? "yeni" : ""}" onclick="kareTikla(${k.i})" title="${k.ad}">
    <div class="mt-bant" style="background:${renk}">${k.tur === "ticaret" ? "⚓" : ""}</div>
    <div class="mt-ad">${k.ad}</div>${yapi ? `<div class="mt-yapi">${yapi}</div>` : ""}</div>`;
}
function tapuAlaniCiz(i) {
  const el = document.getElementById("tapular" + i); if (!el) return;
  const o = G && G.oyuncular[i];
  if (!o || o.iflas) { el.innerHTML = ""; tapuIzi[i] = null; return; }
  const mulk = G.kareler.filter(k => k.sahip === o.id);
  const iz = mulk.map(k => k.i + ":" + k.seviye).join(",");
  if (tapuIzi[i] && tapuIzi[i].iz === iz) return;
  const onceki = tapuIzi[i] ? tapuIzi[i].set : new Set();
  const gruplar = {};
  for (const k of mulk) (gruplar[k.tur === "sehir" ? k.ulke : "Limanlar"] ||= []).push(k);
  el.innerHTML = Object.entries(gruplar).map(([g, ks]) =>
    `<div class="tapu-grup ${g !== "Limanlar" && tamSet(o.id, g) ? "tam" : ""}">${ks.map(k => miniTapu(k, !onceki.has(k.i))).join("")}</div>`).join("");
  tapuIzi[i] = {iz, set: new Set(mulk.map(k => k.i))};
}
function insaTikla(i) { const p = suanki(), k = G.kareler[i]; if (!mesgul && !bekleyen && insaEdilebilir(p, k)) { insaEt(p, k); render(); } }
function satTikla(i) { const p = suanki(), k = G.kareler[i]; if (!mesgul && !bekleyen && satilabilir(p, k)) { yapiSat(p, k); render(); } }

   PENCERELER

function pencereAc(html) { if (!html.includes("İnşa et / sat")) insaAcik = false; document.getElementById("pencere").innerHTML = `<div class="perde"><div class="pencere">${html}</div></div>`; }
function pencereKapat() { document.getElementById("pencere").innerHTML = ""; insaAcik = false; }

let kurulumSayi = 2;
let kurulumSecim = ["Fes", "Prusya Kaskı", "Napolyon Şapkası", "Roma Miğferi"];
function kurulumGoster() {
    const koltuklar = ["P1 · sol üst", "P2 · sağ üst", "P3 · sol alt", "P4 · sağ alt"];
  let kartlar = "";
  for (let i = 0; i < 4; i++) {
    kartlar += `<div class="k-kart" id="ks${i}" style="--pr:${OYUNCU_RENKLERI[i]};${i < kurulumSayi ? "" : "display:none"}">

        <div class="k-bilgi"><div class="k-koltuk">${koltuklar[i]}</div>
          <input id="ka${i}" value="" maxlength="16" placeholder="İsmini yaz">

      <div class="k-adi" id="kad${i}"></div>
      <div class="k-secim" id="kg${i}"></div></div>`;
  }
  pencereAc(`<h2>ROADS OF EMPIRE</h2>
    <div style="text-align:center;margin:-2px 0 10px">Oyuncu sayısı:
      <select id="ksayi" onchange="kurulumSayiDegis(this.value)">${[2,3,4].map(n => `<option ${n === kurulumSayi ? "selected" : ""}>${n}</option>`).join("")}</select>
      <span class="not">· Herkes piyonunu aşağıdan seçer</span></div>
    <div class="k-izgara">${kartlar}</div>
    <div id="khata" style="color:#a02020;text-align:center;min-height:20px"></div>
    <div style="text-align:center"><button class="btn altin" onclick="kurulumBasla()">⚔ Oyunu başlat</button></div>`);
  kurulumCiz();
}
function kurulumCiz() {
  for (let i = 0; i < 4; i++) {
    document.getElementById("kp" + i).innerHTML = piyonSVG(kurulumSecim[i]);
    document.getElementById("kad" + i).textContent = kurulumSecim[i];
    document.getElementById("kg" + i).innerHTML = Object.keys(PIYONLAR).map(ad => {
      const baskasi = kurulumSecim.some((x, j) => j !== i && j < kurulumSayi && x === ad);
      return `<button class="k-p ${kurulumSecim[i] === ad ? "secili" : ""}" ${baskasi ? "disabled" : ""} title="${ad}" onclick="kurulumPiyonSec(${i}, '${ad}')">${piyonSVG(ad)}</button>`;
    }).join("");
  }
}
function kurulumPiyonSec(i, ad) { kurulumSecim[i] = ad; kurulumCiz(); }
function kurulumSayiDegis(n) {
  kurulumSayi = +n;
  for (let i = 0; i < 4; i++) document.getElementById("ks" + i).style.display = i < kurulumSayi ? "" : "none";
  // yeni gelen oyuncunun piyonu başkasınınkiyle aynıysa boş bir piyon ver
  for (let i = 0; i < kurulumSayi; i++) if (kurulumSecim.slice(0, i).includes(kurulumSecim[i]))
    kurulumSecim[i] = Object.keys(PIYONLAR).find(ad => !kurulumSecim.slice(0, kurulumSayi).includes(ad));
  kurulumCiz();
}
function kurulumBasla() {
  const a = [];
  for (let i = 0; i < kurulumSayi; i++) {
    const bot = document.getElementById("kb" + i).checked;
    a.push({ad: document.getElementById("ka" + i).value.trim() || (bot ? "Bilgisayar " : "Oyuncu ") + (i + 1), piyon: kurulumSecim[i], bot: document.getElementById("kb" + i).checked}); }
  if (new Set(a.map(x => x.piyon)).size !== a.length) { document.getElementById("khata").textContent = "Her oyuncu farklı bir piyon seçmeli."; return; }
  pencereKapat(); yeniOyun(a);
}

function kurallariGoster() {
  const satir = TAHTA.filter(k => k.tur === "sehir").map(k => `<tr><td><span class="renk-kutu" style="background:${renkOf(k.ulke)}"></span>${k.ad}</td>
      <td>${k.ulke}</td><td>${k.fiyat}</td>${k.kira.map(x => `<td>${x}</td>`).join("")}<td>${ULKELER[k.ulke].kule} / ${ULKELER[k.ulke].kale}</td></tr>`).join("");
  const catilar = [...new Set(Object.values(ULKELER).map(u => u.cati))].map(c => `<b>${c}</b>: ${Object.keys(ULKELER).filter(u => ULKELER[u].cati === c).join(" + ")}${c === "Mare Mercatorum" ? " + 4 liman" : ""}`).join(" · ");
  pencereAc(`<h2>Kurallar ve fiyatlar</h2>
    <ul>
      <li>Herkes <b>${para(AYAR.baslangicParasi)}</b> ile başlar. Başlangıç karesinden her geçişte <b>+${para(AYAR.baslangicBonusu)}</b>.</li>
      <li>Sahipsiz bir şehre ya da limana gelince satın alabilirsin. Başkasının şehrine gelince kira ödersin.</li>
      <li>Bir ülkenin bütün şehirleri sendeyse boş şehrin kirası artar. O ülkenin bir şehrine <b>geldiğin turda</b> o şehre <b>kule</b> dikebilirsin; 4 kuleden sonra <b>kale</b> gelir. Her kule aynı fiyattır. Yapılar yarı fiyatına geri satılır.</li>
      <li><b>Çatılar:</b> İberya (Portekiz + İspanya), Asya'nın Efendileri (Rusya + Japonya), Angevin (İngiltere + Fransa), Mare Mercatorum (Venedik + 4 liman) ve Roma. Bir çatının tamamı sendeyse o çatıdaki bütün kiraların <b>1.5 katına</b> çıkar.</li>
      <li><b>Şans:</b> tarihî bir kart çekersin. <b>Vergi:</b> ${AYAR.vergi} ödersin.</li>
      <li><b>Sürgün:</b> şans kartıyla ya da üst üste 3 çift atınca gidersin. Çıkmak için ${AYAR.surgunCikisUcreti} öde, çift at ya da af mektubunu kullan. En fazla ${AYAR.surgunMaksTur} tur beklersin.</li>
      <li><b>Kâşif:</b> ${AYAR.kasifUcreti} ödeyip istediğin kareye gidebilirsin (Başlangıç bonusu almazsın). <b>Kervansaray:</b> dinlenme.</li>
      <li>Borcunu ödeyemezsen önce yapıların yarı fiyatına satılır; yine yetmezse iflas edersin. Son kalan oyuncu kazanır ya da "Oyunu bitir" deyince en zengin oyuncu kazanır.</li>
    </ul>
    <p class="not">Çatılar: ${catilar}</p>
    <h3>Şehirler <span class="not">(satın alma fiyatları GEÇİCİ)</span></h3>
    <table><tr><th>Şehir</th><th>Ülke</th><th>Fiyat</th><th>Boş</th><th>Tam set</th><th>1 kule</th><th>2 kule</th><th>3 kule</th><th>4 kule</th><th>Kale</th><th>Kule / Kale fiyatı</th></tr>${satir}</table>
    <p class="not">Limanlar (Ivory Coast, Malaka, Cebelitarık, Alexandria): tanesi ${AYAR.limanFiyati}; kira ${AYAR.limanKiralari.join(" / ")} (sahip olunan liman sayısına göre).</p>
    <div style="text-align:center"><button class="btn" onclick="pencereKapat()">Kapat</button></div>`);
}

tahtaKur();
kurulumGoster();
</script>
</body>
</html>
